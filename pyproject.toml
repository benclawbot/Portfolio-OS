[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-os"
version = "1.0.0"
description = "Evidence-based GitHub portfolio governance and automation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pyright>=1.1.403",
  "build>=1.2",
]

[project.scripts]
portfolio-os = "portfolio_os.cli:main"
portfolio-report = "portfolio_os.portfolio_cli:main"
portfolio-trends = "portfolio_os.trends_cli:main"
portfolio-dashboard = "portfolio_os.dashboard_cli:main"
portfolio-refresh = "portfolio_os.pipeline_cli:main"
portfolio-policy = "portfolio_os.policy_cli:main"
portfolio-ops = "portfolio_os.operations_cli:main"
portfolio-workspace = "portfolio_os.workspace_cli:main"
portfolio-github-index = "portfolio_os.github_index_cli:main"
portfolio-backlog = "portfolio_os.backlog_cli:main"
portfolio-service = "portfolio_os.service_cli:main"
portfolio-artifacts = "portfolio_os.artifacts_cli:main"

[project.entry-points."portfolio_os.analyzers"]

[tool.setuptools.packages.find]
include = ["portfolio_os", "portfolio_os.*"]
exclude = ["tests", "tests.*", "docs", "docs.*", "config", "config.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["portfolio_os"]
omit = ["portfolio_os/*_cli.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.pyright]
include = ["portfolio_os"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
