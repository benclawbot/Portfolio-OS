name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q portfolio_os
      - name: Test
        run: python -m pytest -q
      - name: DNA smoke test
        run: |
          python -m portfolio_os.cli dna tests/fixtures/sample_repo --output /tmp/sample-dna.json
          python -m portfolio_os.cli compare tests/fixtures/sample_repo tests/fixtures/sample_repo --pretty
