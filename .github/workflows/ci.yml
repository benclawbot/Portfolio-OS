name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q portfolio_os
      - name: Lint correctness
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check portfolio_os tests 2>&1 | tee ruff.txt
      - name: Type check
        id: types
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pyright portfolio_os 2>&1 | tee pyright.txt
      - name: Test with coverage
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --cov=portfolio_os --cov-branch --cov-report=term-missing --cov-fail-under=90 2>&1 | tee pytest.txt
      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            ruff.txt
            pyright.txt
            pytest.txt
      - name: Enforce quality gates
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPE_OUTCOME: ${{ steps.types.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          test "$LINT_OUTCOME" = success
          test "$TYPE_OUTCOME" = success
          test "$TEST_OUTCOME" = success
      - name: Build distributions
        run: python -m build
      - name: Console entry points
        run: |
          portfolio-os --help
          portfolio-github-index --help
          portfolio-backlog --help
          portfolio-artifacts --help
          portfolio-service --help
          portfolio-report --help
          portfolio-trends --help
          portfolio-dashboard --help
          portfolio-refresh --help
          portfolio-policy --help
          portfolio-ops --help
          portfolio-workspace --help
      - name: End-to-end workspace
        run: |
          mkdir -p /tmp/portfolio-os-v1/github
          printf '{"owner":"benclawbot","synchronized_at":"","repositories":{}}\n' > /tmp/portfolio-os-v1/sync-state.json
          printf '{"schema_version":1,"owner":"benclawbot","repositories":{}}\n' > /tmp/portfolio-os-v1/github/index.json
          portfolio-refresh --workspace /tmp/portfolio-os-v1 --skip-sync --lineage-config config/portfolio.json --enforce-policy --pretty
          portfolio-policy --workspace /tmp/portfolio-os-v1 --pretty
          portfolio-backlog --workspace /tmp/portfolio-os-v1 --pretty
          portfolio-artifacts --workspace /tmp/portfolio-os-v1 catalog
          portfolio-service --workspace /tmp/portfolio-os-v1 jobs
          portfolio-ops runs --workspace /tmp/portfolio-os-v1 --pretty
          portfolio-ops lock-status --workspace /tmp/portfolio-os-v1 --pretty
          portfolio-workspace validate --workspace /tmp/portfolio-os-v1 --pretty
          portfolio-workspace repair-plan --workspace /tmp/portfolio-os-v1 --pretty
          test -f /tmp/portfolio-os-v1/pipeline/latest-run.json
          test "$(find /tmp/portfolio-os-v1/pipeline/runs -type f | wc -l)" -eq 1
          test -f /tmp/portfolio-os-v1/policy/latest-policy.json
          test -f /tmp/portfolio-os-v1/github/index.json
          test -f /tmp/portfolio-os-v1/portfolio/portfolio-summary.json
          test -f /tmp/portfolio-os-v1/lineage/repository-lineage.json
          test -f /tmp/portfolio-os-v1/reuse/duplicate-components.json
          test -f /tmp/portfolio-os-v1/backlog/portfolio-backlog.json
          test -f /tmp/portfolio-os-v1/documents/CHANGELOG.generated.md
          test -f /tmp/portfolio-os-v1/documents/RELEASE-NOTES.generated.md
          test -f /tmp/portfolio-os-v1/documents/ARCHITECTURE.generated.md
          test -f /tmp/portfolio-os-v1/telemetry/metrics.json
          test -f /tmp/portfolio-os-v1/artifacts/catalog.json
          test -f /tmp/portfolio-os-v1/dashboard/index.html
          test -f /tmp/portfolio-os-v1/workspace/manifest.json
          test ! -f /tmp/portfolio-os-v1/.portfolio-os-refresh.lock
          grep -q '"status": "completed"' /tmp/portfolio-os-v1/pipeline/latest-run.json
          grep -q '"status": "passed"' /tmp/portfolio-os-v1/policy/latest-policy.json
          grep -q '"validation"' /tmp/portfolio-os-v1/workspace/manifest.json
          grep -q '"github_index"' /tmp/portfolio-os-v1/workspace/manifest.json
          grep -q '"telemetry"' /tmp/portfolio-os-v1/workspace/manifest.json
          grep -q "Highest-priority backlog" /tmp/portfolio-os-v1/dashboard/index.html
          grep -q "Recent refresh runs" /tmp/portfolio-os-v1/dashboard/index.html
          grep -q "Policy" /tmp/portfolio-os-v1/dashboard/index.html
          ! grep -qi "<script" /tmp/portfolio-os-v1/dashboard/index.html
          ! grep -qi "https://" /tmp/portfolio-os-v1/dashboard/index.html
      - name: DNA and graph smoke tests
        run: |
          python -m portfolio_os.cli dna tests/fixtures/sample_repo --output /tmp/sample-dna.json
          python -m portfolio_os.cli compare tests/fixtures/sample_repo tests/fixtures/sample_repo --pretty
          python -m portfolio_os.cli graph-build tests/fixtures/sample_repo --output /tmp/portfolio-graph.json
          python -m portfolio_os.cli graph-query /tmp/portfolio-graph.json repo:sample_repo
          python -m portfolio_os.cli graph-path /tmp/portfolio-graph.json repo:sample_repo technology:languages:Python
